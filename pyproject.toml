[project]
name = "kt-py-logger"
version = "0.2.0"
description = "Shareable, configurable logging for Keytrends Python services (loguru + stdlib intercept, field-agnostic per-request context, noise demotion)."
authors = [
    {name = "Julio", email = "julior@keytrends.ai"}
]
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = [
    "loguru (>=0.7.3,<0.8.0)"
]

[tool.poetry]
packages = [
    { include = "kt_logger" }
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 119

[tool.ruff.lint]
extend-select = ["I", "F401"]
